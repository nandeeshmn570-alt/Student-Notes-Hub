<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Notes Portal - Contact</title>
    <link rel="stylesheet" href="subject.css">
    <link rel="stylesheet" href="home.css">

</head>

<body>
    <nav>
        <div class="navbar">
            <div class="navbar-logo">🎓 CAMPUS NOTES</div>
            <div class="navbar-contents">
                <div class="home-page"><a href="home.html">Home</a></div>
                <div class="notes-page"><a href="notes.html">Notes</a></div>
                <div class="contact-page"><a href="contact.html">Contact</a></div>
                <div class="about-page"><a href="about.html">About</a></div>
            </div>
        </div>
    </nav>
    <form id="uploadForm" >
        <main class="notes-subject1">
            <div class="notes-card">
                <div class="file-container">
                    <input type="file" name="file" multiple>
                    <input type="hidden" name="subject" value="subject1">
                </div>
                <button class="add-btn" type="button" onclick="magic()">+Add File</button>
                <button type="submit">upload</button>
            </div>
            </form>
            <h2 class="note-title">Available Notes</h2>
            <div id="file-list" class="notes-gallery"></div>
        </main>
    
    <footer>@ 2026 Student Notes Portal | Engineering study Resources</footer>
    <script>

        function magic() {
            const fileDiv = document.getElementsByClassName("file-container")[0]
            const input = document.createElement("input")
            input.type = "file"
            input.name = "file"

            const wrapper = document.createElement("div")
            wrapper.className = "file-row"


            const removeBtn = document.createElement("button")
            removeBtn.innerText = "X"
            removeBtn.className = "remove-btn"

            removeBtn.onclick = function () {
                wrapper.remove()
            }
            wrapper.appendChild(input)
            wrapper.appendChild(removeBtn)
            fileDiv.appendChild(wrapper)

        }

        let isAdmin = false;

        fetch("/check-admin", {
            credentials: "include"
        }).then(res => res.json())
            .then(data => {
                isAdmin = data.isAdmin;

               
                return fetch("/files?subject=subject7");
            })
            .then(res => res.json())
            .then(files => {
                const container = document.getElementById("file-list");
                container.innerHTML = "";

                files.forEach(file => {
                    const div = document.createElement("div");
                    div.style.marginBottom = "10px";

                   
                    const link = document.createElement("a");
                    link.href = "/uploads/subject1/" + file.fileName;
                    const cleanName=file.fileName.split("-").slice(1).join("-");
                    link.innerText = "📄 " + cleanName;
                    link.target = "_blank";
                    link.classList.add("note-box")
                    div.className="file-item"

                    div.appendChild(link);

                    
                    if (isAdmin) {
                        const delBtn = document.createElement("button");
                        delBtn.innerText = "Delete";
                        delBtn.className="delete-btn"
                        delBtn.style.marginLeft = "10px";

                        delBtn.onclick = async () => {
                            if (!confirm("Delete this file?")) return;

                            const res = await fetch(`/delete?subject=subject7&filename=${file.fileName}`, {
                                method: "DELETE",
                                credentials: "include"
                            });

                            const data = await res.json();

                            if (res.ok) {
                                alert("Deleted ✅");
                                location.reload();
                            } else {
                                alert(data.message);
                            }
                        };

                        div.appendChild(delBtn);
                    }

                    container.appendChild(div);
                });
            })
            .catch(err => {
                console.error("Error loading files:", err);
            });
        document.getElementById("uploadForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const formData = new FormData();
            const inputs = document.querySelectorAll('input[type="file"]');

            inputs.forEach(input => {
                for(let i=0;i<input.files.length;i++) {
                    formData.append("file", input.files[i]);
                }
            });

            try {
                const res = await fetch("http://localhost:3000/upload?subject=subject7", {
                    method: "POST",
                    body: formData,
                    credentials: "include"
                });

                const data = await res.json();

                if (res.ok) {
                    alert("Upload successful ✅");
                    location.reload(); 
                }else if (res.status === 403) {
                                alert("❌ Only admin can add notes.");
                            } else {
                    alert(data.message);
                }

            } catch (err) {
                console.error(err);
                alert("Upload failed ❌");
            }
        });



    </script>

</body>

</html>
